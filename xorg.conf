Section "ServerFlags"
    Option "AutoAddDevices" "on"
    Option "AIGLX" "off"
EndSection

# QEMU stdvga and the older integrated GPUs targeted by AdavaLinux may expose
# modesetting without a usable glamor/swrast stack.  Software modesetting
# avoids stale Damage/RENDER regions where GTK content appeared only after
# pointer motion.
Section "Device"
    Identifier "AdavaLinux Graphics"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
